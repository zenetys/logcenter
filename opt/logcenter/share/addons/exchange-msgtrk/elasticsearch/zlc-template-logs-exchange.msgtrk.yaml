version: 2
index_patterns:
  - logs-exchange.msgtrk-zlc
  - logs-exchange.msgtrk-zlc.*
priority: 700
composed_of:
  - zlc-component-logs-exchange.msgtrk-dynamic
  - zlc-component-logs-exchange.msgtrk-dynamic@custom
  - logs@mappings
  - ecs@mappings
  - zlc-component-default
  - zlc-component-default@custom
  - zlc-component-logs@custom
  - zlc-component-logs-exchange.msgtrk@custom
ignore_missing_component_templates:
  - zlc-component-logs-exchange.msgtrk-dynamic@custom
  - zlc-component-default@custom
  - zlc-component-logs@custom
  - zlc-component-logs-exchange.msgtrk@custom
data_stream: {}
template:
  mappings:
    properties:
      client.domain: { type: zlc_alias, target: { path: exchange.msgtrk.client_hostname, type: [ keyword, text ] } }
      email.direction: { type: zlc_alias, target: { path: exchange.msgtrk.directionality, type: keyword } }
      email.local_id: { type: zlc_alias, target: { path: exchange.msgtrk.internal_message_id, type: keyword } }
      email.message_id: { type: zlc_alias, target: { path: exchange.msgtrk.message_id, type: wildcard } }
      email.sender.address: { type: zlc_alias, target: { path: exchange.msgtrk.sender_address, type: keyword } }
      email.subject: { type: zlc_alias, target: { path: exchange.msgtrk.message_subject, type: [ keyword, text ] } }
      event.dataset: { type: zlc_alias, target: { path: data_stream.dataset, type: constant_keyword } }
      network.bytes: { type: zlc_alias, target: { path: exchange.msgtrk.total_bytes, type: long } }
      server.domain: { type: zlc_alias, target: { path: exchange.msgtrk.server_hostname, type: [ keyword, text ] } }
