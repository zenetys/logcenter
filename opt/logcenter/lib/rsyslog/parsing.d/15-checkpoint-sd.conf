if ($.parsing_done != 1 and
    ($.try_parsers!checkpoint-sd == 1 or
     $.app-name == "CheckPoint")) then {

    action(
        type="mmnormalize"
        name="norm-checkpoint-sd"
        rulebase="checkpoint-sd.rb"
        variable="$.structured-data"
        path="$!"
    )
    if ($parsesuccess == "OK") then {
        # @timestamp is left to the reception time: checkpoint time fields have only a
        # second accuracy.
        #
        # Fields are renamed to ECS when the value is kept as is (number conversion aside),
        # copied when it gets transformed.
        #
        # Field rule_action is not used, it may be Accept for a dropped connection.
        #
        # Fields checkpoint.{time,lastupdatetime,segment_time,start_time,creation_time,
        # last_hit_time,policy_time,packet_capture_time,login_timestamp,arrival_time,
        # delivery_time} should be mapped as type date, format epoch_second. Some
        # versions send checkpoint.time in milliseconds.
        #
        # Renamed fields:
        # checkpoint.loguid event.id
        # checkpoint.src source.ip
        # checkpoint.client_ip source.ip (if no src), client.ip otherwise
        # checkpoint.s_port source.port
        # checkpoint.dst destination.ip
        # checkpoint.service destination.port
        # checkpoint.xlatesrc source.nat.ip
        # checkpoint.xlatesport source.nat.port
        # checkpoint.xlatedst destination.nat.ip
        # checkpoint.xlatedport destination.nat.port
        # checkpoint.client_outbound_bytes source.bytes
        # checkpoint.server_outbound_bytes destination.bytes
        # checkpoint.bytes network.bytes
        # checkpoint.proto network.iana_number
        # checkpoint.origin observer.ip
        # checkpoint.product observer.product
        # checkpoint.ifname observer.{ingress,egress}.interface.name (from ifdir)
        # checkpoint.inzone observer.ingress.zone
        # checkpoint.outzone observer.egress.zone
        # checkpoint.rule_name rule.name
        # checkpoint.rule_uid rule.uuid
        # checkpoint.resource url.original

        set $!event.kind = "event";

        # audit logs
        if ($!checkpoint!operation == "Log In") then {
            set $!event.category = "authentication";
            set $!event.type = "start";
            if ($!checkpoint!audit_status == "Failure") then
                set $!event.outcome = "failure";
            else
                set $!event.outcome = "success";
        }
        else if ($!checkpoint!operation == "Log Out") then {
            set $!event.category = "authentication";
            set $!event.type = "end";
            set $!event.outcome = "success";
        }
        # identity awareness, vpn logs
        else if ($!checkpoint!action == "Log In") then {
            set $!event.category = "authentication";
            set $!event.type = "start";
            set $!event.outcome = "success";
        }
        else if ($!checkpoint!action == "Failed Log In") then {
            set $!event.category = "authentication";
            set $!event.type = "start";
            set $!event.outcome = "failure";
        }
        else if ($!checkpoint!src != "" and $!checkpoint!dst != "") then {
            set $!event.category = "network";
            if ($!checkpoint!action == ["Accept", "Allow"]) then {
                set $!event.type = "connection,allowed";
                set $!event.outcome = "success";
            }
            else if ($!checkpoint!action == ["Drop", "Reject", "Block"]) then {
                set $!event.type = "connection,denied";
                set $!event.outcome = "failure";
            }
            else if ($!checkpoint!action == "Prevent") then {
                set $!event.kind = "alert";
                set $!event.category = "network,intrusion_detection";
                set $!event.type = "connection,denied";
                set $!event.outcome = "failure";
            }
            else if ($!checkpoint!action == "Detect") then {
                set $!event.kind = "alert";
                set $!event.category = "network,intrusion_detection";
                set $!event.type = "connection,allowed";
                set $!event.outcome = "success";
            }
            else {
                set $!event.type = "connection";
            }
        }

        # operation is set on audit logs, action is then Accept
        if ($!checkpoint!operation != "") then
            set $!event.action = tolower($!checkpoint!operation);
        else if ($!checkpoint!action != "") then
            set $!event.action = tolower($!checkpoint!action);

        # updates of a same log share the same loguid
        if ($!checkpoint!loguid != "") then { set $!event.id = $!checkpoint!loguid; unset $!checkpoint!loguid; }

        # client_ip is set on audit and authentication logs
        if ($!checkpoint!src != "") then { set $!source.ip = $!checkpoint!src; unset $!checkpoint!src; }
        if ($!checkpoint!client_ip != "") then {
            if ($!source.ip == "") then
                set $!source.ip = $!checkpoint!client_ip;
            else
                set $!client.ip = $!checkpoint!client_ip;
            unset $!checkpoint!client_ip;
        }
        if ($!checkpoint!s_port != "") then { set $!source.port = cnum($!checkpoint!s_port); unset $!checkpoint!s_port; }
        if ($!checkpoint!dst != "") then { set $!destination.ip = $!checkpoint!dst; unset $!checkpoint!dst; }
        if ($!checkpoint!service != "" and $!checkpoint!service != ["4294967295", "-1"]) then {
            set $!destination.port = cnum($!checkpoint!service);
            unset $!checkpoint!service;
        }

        # no NAT when 0.0.0.0 or port 0
        if ($!checkpoint!xlatesrc != "" and $!checkpoint!xlatesrc != "0.0.0.0") then {
            set $!source.nat.ip = $!checkpoint!xlatesrc;
            unset $!checkpoint!xlatesrc;
        }
        if ($!checkpoint!xlatesport != "" and $!checkpoint!xlatesport != "0") then {
            set $!source.nat.port = cnum($!checkpoint!xlatesport);
            unset $!checkpoint!xlatesport;
        }
        if ($!checkpoint!xlatedst != "" and $!checkpoint!xlatedst != "0.0.0.0") then {
            set $!destination.nat.ip = $!checkpoint!xlatedst;
            unset $!checkpoint!xlatedst;
        }
        if ($!checkpoint!xlatedport != "" and $!checkpoint!xlatedport != "0") then {
            set $!destination.nat.port = cnum($!checkpoint!xlatedport);
            unset $!checkpoint!xlatedport;
        }

        if ($!checkpoint!client_outbound_bytes != "") then {
            set $!source.bytes = cnum($!checkpoint!client_outbound_bytes);
            unset $!checkpoint!client_outbound_bytes;
        }
        if ($!checkpoint!server_outbound_bytes != "") then {
            set $!destination.bytes = cnum($!checkpoint!server_outbound_bytes);
            unset $!checkpoint!server_outbound_bytes;
        }
        if ($!checkpoint!bytes != "") then { set $!network.bytes = cnum($!checkpoint!bytes); unset $!checkpoint!bytes; }

        if ($!checkpoint!proto != "" and $!checkpoint!proto != ["4294967295", "-1"]) then {
            set $!network.transport = lookup("lookup-iana-proto-num2name", $!checkpoint!proto);
            set $!network.iana_number = $!checkpoint!proto;
            unset $!checkpoint!proto;
        }
        if ($!checkpoint!app_name != "") then
            set $!network.application = tolower($!checkpoint!app_name);
        else if ($!checkpoint!service_id != "") then
            set $!network.application = tolower($!checkpoint!service_id);

        # origin is the gateway, the sender may be a log exporter running on the management server
        if ($!checkpoint!origin != "") then { set $!observer.ip = $!checkpoint!origin; unset $!checkpoint!origin; }
        # CN=fw-name,O=mgmt-name..abcdef
        if ($!checkpoint!originsicname startswith ["CN=", "cn="]) then
            set $!observer.name = substring(field($!checkpoint!originsicname, 44, 1), 3, 255);
        if ($!checkpoint!product != "") then { set $!observer.product = $!checkpoint!product; unset $!checkpoint!product; }
        if ($!checkpoint!ifname != "") then {
            if ($!checkpoint!ifdir == "inbound") then {
                set $!observer.ingress.interface.name = $!checkpoint!ifname;
                unset $!checkpoint!ifname;
            }
            else if ($!checkpoint!ifdir == "outbound") then {
                set $!observer.egress.interface.name = $!checkpoint!ifname;
                unset $!checkpoint!ifname;
            }
        }
        if ($!checkpoint!inzone != "") then { set $!observer.ingress.zone = $!checkpoint!inzone; unset $!checkpoint!inzone; }
        if ($!checkpoint!outzone != "") then { set $!observer.egress.zone = $!checkpoint!outzone; unset $!checkpoint!outzone; }

        # rule keys are repeated per policy layer, the last one wins
        if ($!checkpoint!rule_name != "") then { set $!rule.name = $!checkpoint!rule_name; unset $!checkpoint!rule_name; }
        if ($!checkpoint!rule_uid != "") then { set $!rule.uuid = $!checkpoint!rule_uid; unset $!checkpoint!rule_uid; }

        # user, src_user_name, administrator: jdoe, John Doe (jdoe)
        if ($!checkpoint!user != "") then
            set $.checkpoint_user = $!checkpoint!user;
        else if ($!checkpoint!src_user_name != "") then
            set $.checkpoint_user = $!checkpoint!src_user_name;
        else if ($!checkpoint!administrator != "") then
            set $.checkpoint_user = $!checkpoint!administrator;
        if ($.checkpoint_user != "") then {
            if ($.checkpoint_user contains " (") then {
                set $.checkpoint_user_fn = field($.checkpoint_user, 40, 1);
                set $!user.full_name = substring($.checkpoint_user_fn, 0, strlen($.checkpoint_user_fn) - 1);
                set $!user.name = field(field($.checkpoint_user, 40, 2), 41, 1);
            }
            else {
                set $!user.name = $.checkpoint_user;
            }
        }

        if ($!checkpoint!resource != "") then {
            set $!url.original = $!checkpoint!resource;
            unset $!checkpoint!resource;
            set $.parse-url!input = $!url.original;
            call ruleset-parse-url
            if ($.parse-url!success == 1) then
                set $!url = $.parse-url!output;
        }

        set $!tags = $!tags & ",fw,checkpoint";
        set $!data_stream.dataset = "firewall.checkpoint";
        set $.parsing_done = 1;
    }
}
