if ($.parsing_done != 1 and
    ($.app-name == "coraza-audit" or $.try_parsers!coraza-spoa-json == 1) and
    $.msg startswith '{"transaction":' and
    parse_json($.msg, "\$!coraza") == 0) then {

    if ($!coraza!transaction!server_id != "") then {
        # https is only a guess
        set $!url.full = "http";
        if ($!coraza!transaction!host_port == 443 or $!coraza!transaction!server_id endswith ":443" or $!coraza!transaction!request!protocol startswith "HTTP/2") then
            set $!url.full = $!url.full & "s";
        set $!url.full = $!url.full & "://" & tolower($!coraza!transaction!server_id) & $!coraza!transaction!request!uri;
        action(
            type="mmnormalize"
            name="norm-url-coraza-audit-json"
            rulebase="url.rb"
            variable="$!url.full"
            path="$!url"
        )
    }
    set $!http.request.id = $!coraza!transaction!id;
    set $!http.request.method = $!coraza!transaction!request!method;
    if ($!coraza!transaction!request!length > 0) then
        set $!http.request.body.bytes = $!coraza!transaction!request!length;
    if ($!coraza!transaction!request!protocol startswith "HTTP/") then
        set $!http.version = field($!coraza!transaction!request!protocol, 47, 2);
    if ($!coraza!transaction!response!status > 0) then
        set $!http.response.status_code = $!coraza!transaction!response!status;

    set $!source.ip = $!coraza!transaction!client_ip;
    set $!source.port = $!coraza!transaction!client_port;
    set $!destination.ip = $!coraza!transaction!host_ip;
    set $!destination.port = $!coraza!transaction!host_port;

    if (exists($!coraza!transaction!request!headers!authorization)) then
        set $!coraza!transaction!request!headers!authorization = "Basic YXV0aDpyZW1vdmVkX2J5X3BhcnNlcg==";
    if (exists($!coraza!transaction!request!headers!user-agent)) then
        set $!user_agent.original = $!coraza!transaction!request!headers!user-agent[0];

    # rule with the highest defined severity (0 is the highest, -1 undefined)
    # names the event, else the first rule
    set $.rule_ids = "";
    set $.severity = 8;
    foreach ($.m in $!coraza!messages) do {
        set $.rule_ids = $.rule_ids & "," & $.m!data!id;
        if ($.m!data!severity >= 0 and $.m!data!severity < $.severity) then {
            set $.severity = $.m!data!severity;
            set $!rule.name = $.m!data!msg;
        }
        else if ($!rule.name == "") then {
            set $!rule.name = $.m!data!msg;
        }
    }

    set $!event.type = "access";
    if ($.rule_ids != "") then {
        set $!event.kind = "alert";
        set $!event.category = "intrusion_detection,web";
        set $!rule.id = split(substring($.rule_ids, 1, -1), ",");
        set $!rule.ruleset = $!coraza!transaction!producer!rulesets;
        set $!message = $!rule.name;
        if ($.severity < 8) then {
            set $!event.severity = $.severity;
            set $!log.level = lookup("lookup-syslog-severity-num2name", $.severity);
        }
    }
    else {
        set $!event.kind = "event";
        set $!event.category = "web";
    }

    if ($!coraza!transaction!is_interrupted == 1) then {
        set $!event.outcome = "failure";
        set $!event.type = $!event.type & ",denied";
    }
    else {
        set $!event.outcome = "success";
        set $!event.type = $!event.type & ",allowed";
    }

    # assume coraza servers' clocks are correct
    set $!@timestamp = substring(format_time($!coraza!transaction!unix_timestamp / 1000000000, "date-rfc3339"), 0, 19)
         & "." & substring(cstr($!coraza!transaction!unix_timestamp % 1000000000 + 1000000000), 1, 9) & "Z";

    set $!tags = $!tags & ",waf,coraza";
    set $!data_stream.dataset = "waf.coraza.audit";
    set $.parsing_done = 1;
}
