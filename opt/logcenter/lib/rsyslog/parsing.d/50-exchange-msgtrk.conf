if ($.parsing_done != 1 and
    $.app-name == "exchange-msgtrk" and
    $.structured-data startswith "[NXLOG@") then {

    if (not(exists($.rfc5424-sd))) then
        action(type="mmpstrucdata" name="parse-sd-exchange-msgtrk" jsonroot=".")

    if ($.rfc5424-sd!nxlog@14506!sourcemodulename contains "msgtrk") then {
        action(
            type="mmnormalize"
            rulebase="/etc/logcenter/rsyslog/parsing.d/exchange-msgtrk-nxlog.rb"
            name="norm-exchange-msgtrk-nxlog"
            variable="$.msg"
            path="$!"
        )

        if ($parsesuccess == "OK") then {
            set $!log.file.path = $.rfc5424-sd!nxlog@14506!filename;
            set $!event.original = $.msg;
            set $!event.provider = re_extract($.rfc5424-sd!nxlog@14506!filename,
                "\\\\(MSGTRK[^0-9]*)[0-9]+-[0-9]+\\.LOG\$", 0, 1, "unknown");
    
            set $.parsing_done = 1;
            set $!tags = $!tags & ",exchange";
            set $!data_stream.dataset = "exchange.msgtrk";
        }
    }
}
